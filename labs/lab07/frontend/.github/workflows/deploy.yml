name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
          flutter config --enable-web
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get
        working-directory: labs/lab07/frontend  # Verify this path matches your project

      - name: Build web
        run: flutter build web --release --base-href "/<sum25-go-flutter-course>/"  # SEE NOTE BELOW
        working-directory: labs/lab07/frontend

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: labs/lab07/frontend/build/web
          keep_files: false
        
